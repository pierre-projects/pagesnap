<!doctype html>
<meta charset="utf-8">
<title>pagesnap torture test</title>
<style>
  body { margin: 0; font: 18px system-ui; overflow: hidden; } /* scroll lock, like many cookie modals */
  header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #c0392b; color: #fff; display: flex; align-items: center; padding: 0 20px; z-index: 10; }
  .hero { height: 100vh; background: linear-gradient(#2c3e50, #3498db); color: #fff; display: grid; place-items: center; font-size: 48px; }
  nav { position: sticky; top: 60px; background: #f39c12; padding: 10px 20px; }
  .card { margin: 20px; padding: 20px; border: 1px solid #ccc; }
  .card img { width: 300px; height: 150px; background: #eee; display: block; }
  #chat { position: fixed; right: 20px; bottom: 20px; width: 60px; height: 60px; border-radius: 50%; background: #27ae60; }
  #cookie { position: fixed; inset: auto 0 0 0; background: #222; color: #fff; padding: 30px; z-index: 99; }
</style>
<header>FIXED HEADER (should appear once, at top)</header>
<div class="hero">100vh HERO (should be ~900px tall)</div>
<nav>STICKY NAV (should appear once, under hero)</nav>
<main id="feed"></main>
<div id="end">END OF FEED</div>
<div id="chat"></div>
<div id="cookie">We use cookies. <button onclick="this.parentNode.remove(); document.body.style.overflow='auto'">Reject all</button> <button>Accept all</button></div>
<script>
  // Lazy images: only get a src when near the viewport.
  const io = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (!e.isIntersecting) return;
    const img = e.target;
    const n = img.dataset.n;
    img.src = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150"><rect width="300" height="150" fill="hsl(${n * 37 % 360},70%,50%)"/><text x="20" y="90" font-size="40" fill="white">LOADED ${n}</text></svg>`);
    io.unobserve(img);
  }));
  let count = 0;
  function addBatch() {
    for (let i = 0; i < 10; i++) {
      const n = ++count;
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<b>Item ${n}</b><img data-n="${n}">`;
      document.getElementById('feed').append(div);
      io.observe(div.querySelector('img'));
    }
  }
  addBatch();
  // Infinite scroll: 3 more batches as you approach the bottom, then stops.
  addEventListener('scroll', () => {
    if (count < 40 && innerHeight + scrollY > document.body.scrollHeight - 300) setTimeout(addBatch, 200);
  });
</script>
